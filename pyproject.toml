[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-langgraph-quickstart"
version = "0.2.0"
description = "Foundry-style LangGraph agent: MCP + OpenAPI tools, RAG, memory checkpointing, guardrails, LLM-as-a-judge"
requires-python = ">=3.11"

dependencies = [
    # LangChain / LangGraph
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langchain-mcp-adapters>=0.2",

    # Azure OpenAI
    "openai>=1.30",

    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",

    # Config / HTTP
    "pyyaml>=6.0",
    "httpx>=0.27",

    # MCP / OpenAPI bridge
    "fastmcp>=2.0",

    # Type helpers
    "typing-extensions>=4.11",

    # OpenTelemetry
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]

[project.optional-dependencies]
# Memory checkpointer backends (install exactly ONE for persistent memory)
sqlite  = ["langgraph-checkpoint-sqlite>=2.0"]
postgres = ["langgraph-checkpoint-postgres>=2.0"]

# LLM providers
gemini = ["langchain-google-genai>=2.0"]
ibm    = ["langchain-ibm>=0.3"]

# Development tools
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",
    "ruff>=0.4",
    "mypy>=1.10",
]

# Install everything
all = [
    "azure-langgraph-quickstart[sqlite,gemini,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
